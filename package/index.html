    <!--
      M-TIZEN-07 CSP assessment (review tizen__exploiter M2, second half) —
      DELIBERATELY SHIPPED UNCHANGED, honestly recorded rather than theater-
      tightened. `connect-src 'self' https: http: ws: wss:` is wide because
      this app's entire purpose is talking to USER-CONFIGURED servers at
      arbitrary LAN origins and ports: the app origin is `file://` (a `.wgt`),
      so `'self'` carries no API traffic at all, and the default self-hosted
      phlix server answers plain `http://:8096` / `ws://:8097` on the LAN.
      Narrowing to `https: wss:` (or to pinned hosts) breaks every non-TLS
      LAN deployment — that is a product-posture decision (owner-reel note
      filed with this review's close), not a boundary bug, and a blind CSP
      edit here would be security theater against the actual attack the
      finding describes. The shipped cure lives at the STORAGE boundary:
      persisted server/hub address slots pass an http(s) scheme allow-list on
      write and on read (src/resolveConfig.ts, M-TIZEN-07), and the bearer
      hub-relay dial is TLS-mandatory (src/api/hubRelay.ts, M-TIZEN-06), so
      no `javascript:`/`data:`/`file:` address can be stored, suggested, or
      resolved into the credential-carrying base — independent of how permissive
      the fetch-scheme CSP is for legitimate http(s)/ws(s) hosts.

      M-TIZEN-22 (W-min170) script-src HARDENING: the majors-era assessment kept
      'unsafe-inline' in script-src because the boot canary then lived in an
      inline <script>; S515 replaced that with the CSS-only splash below and
      moved renderBootFailure into the bundled main.ts, leaving 'unsafe-inline'
      as dead weight — every script in this document and in the shipped
      package/index.html is an EXTERNAL module ('self'). Dropping it is not
      cosmetic: it removes the one primitive that made any future XSS
      executable (inline <script> AND inline event handlers are both blocked by
      strict script-src), which is also the class-level backstop for the
      hand-rolled innerHTML escape in the vendored MetadataMatchModal (ledger
      row in docs/ui-port-divergence.md — upstream to retire the escape; the
      CSP makes its regression non-executable meanwhile). style-src keeps
      'unsafe-inline' by necessity (the splash <style> block + Vue SFC inline
      styles; styles cannot execute script). tests/unit/cspPolicy.test.ts pins
      both halves of this law against both index.html carriers.

      M-TIZEN-38 (W-min170): the platform twin of this posture is app/config.xml's
      `<access origin="*" subdomains="*">` — the Tizen-widget egress allow that
      lets the webview reach the same arbitrary user-paired origins at all. It
      carries the identical decided-posture reasoning (and the identical
      storage-boundary backstop); tightening the meta without it would be
      decoration, and tightening it first would break the product's premise.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; media-src 'self' https: http: blob:; connect-src 'self' https: http: ws: wss:;"
    />
