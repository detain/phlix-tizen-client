<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no" />
    <!--
      M-TIZEN-07 CSP assessment (review tizen__exploiter M2, second half) —
      DELIBERATELY SHIPPED UNCHANGED, honestly recorded rather than theater-
      tightened. `connect-src 'self' https: http: ws: wss:` is wide because
      this app's entire purpose is talking to USER-CONFIGURED servers at
      arbitrary LAN origins and ports: the app origin is `file://` (a `.wgt`),
      so `'self'` carries no API traffic at all, and the default self-hosted
      phlix server answers plain `http://:8096` / `ws://:8097` on the LAN.
      Narrowing to `https: wss:` (or to pinned hosts) breaks every non-TLS
      LAN deployment — that is a product-posture decision (owner-reel note
      filed with this review's close), not a boundary bug, and a blind CSP
      edit here would be security theater against the actual attack the
      finding describes. The shipped cure lives at the STORAGE boundary:
      persisted server/hub address slots pass an http(s) scheme allow-list on
      write and on read (src/resolveConfig.ts, M-TIZEN-07), and the bearer
      hub-relay dial is TLS-mandatory (src/api/hubRelay.ts, M-TIZEN-06), so
      no `javascript:`/`data:`/`file:` address can be stored, suggested, or
      resolved into the credential-carrying base — independent of how permissive
      the fetch-scheme CSP is for legitimate http(s)/ws(s) hosts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; media-src 'self' https: http: blob:; connect-src 'self' https: http: ws: wss:;"
    />
    <title>Phlix</title>
    <style>
      /*
       * S515 AD-3 — CSS-only branded splash + dark preload background.
       * Paints from the very first frame (no JS, no fetch, no webfont needed),
       * covering module-parse + the S515 boot probe (≤6 s) so the TV never
       * shows white. Nocturne-atmosphere: near-black night-blue field, one
       * amber accent (#f5a524 — the shipped theme's accent), a slow breathing
       * pulse as the honest "still trying" signal. Fixed 1920×1080 viewport is
       * honoured via inset:0 full-bleed. The removal is declarative: Vue's
       * mount fills #phlix-app, and `:not(:empty) ~` retires the splash with
       * zero JS — renderBootFailure() filling the same host retires it too,
       * leaving the readable error, never a splash over a corpse.
       * CSP: style-src 'unsafe-inline' is already declared above.
       */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #07070d;
        color: #efece4;
      }
      #phlix-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          radial-gradient(120% 90% at 50% 40%, #0d0e1a 0%, #07070d 62%, #040407 100%),
          #07070d;
        z-index: 2147483647;
      }
      #phlix-splash .phlix-splash__wordmark {
        font: 700 96px/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.06em;
        color: #efece4;
        text-shadow: 0 0 42px rgba(245, 165, 36, 0.28), 0 2px 0 rgba(0, 0, 0, 0.6);
      }
      #phlix-splash .phlix-splash__rule {
        width: 180px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #f5a524 30% 70%, transparent);
      }
      #phlix-splash .phlix-splash__hint {
        font: 400 22px/1.4 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #8f94a8;
        animation: phlix-splash-breathe 2.4s ease-in-out infinite;
      }
      @keyframes phlix-splash-breathe {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      #phlix-app:not(:empty) ~ #phlix-splash {
        display: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-J2WGZPKQ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DSS28gwf.css">
  </head>
  <body>
    <div id="phlix-app"></div>
    <div id="phlix-spatial-host"></div>
    <div id="phlix-chapter-overlay"></div>
    <div id="phlix-skip-intro-overlay"></div>
    <div id="phlix-pip-overlay"></div>
    <div id="phlix-action-toast-overlay"></div>
    <div id="phlix-quick-connect"></div>
    <div id="phlix-telemetry-consent"></div>
    <div id="phlix-screensaver"></div>
    <div id="phlix-splash" aria-hidden="true">
      <span class="phlix-splash__wordmark">Phlix</span>
      <span class="phlix-splash__rule"></span>
      <span class="phlix-splash__hint">Booting</span>
    </div>
  </body>
</html>
