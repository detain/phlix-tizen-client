name: Lint

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --allow-git=all

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build Check
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --allow-git=all

      - name: Build project
        run: npm run build

      # Review m25 — the former "node scripts/package.js + upload package/"
      # steps are REMOVED from this job: they re-assembled package/ WITHOUT the
      # version-sync first leg (a second, subtly-different package recipe from
      # the release chain) and duplicated build.yml's artifact upload. This job
      # proves the tree compiles; `.github/workflows/build.yml` is the ONE
      # workflow that runs the real `npm run package` chain, asserts committed
      # package/ freshness, and publishes the .wgt artifact.
