name: Lint

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  lint:
    name: Run ESLint
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --allow-git=all

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build Check
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --allow-git=all

      - name: Build project
        run: npm run build

      # Review m25 — the former "node scripts/package.js + upload package/"
      # steps are REMOVED from this job: they re-assembled package/ WITHOUT the
      # version-sync first leg (a second, subtly-different package recipe from
      # the release chain) and duplicated build.yml's artifact upload. This job
      # proves the tree compiles; `.github/workflows/build.yml` is the ONE
      # workflow that runs the real `npm run package` chain, asserts committed
      # package/ freshness, and publishes the .wgt artifact.
