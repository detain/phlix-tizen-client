name: Build

on:
  push:
    branches: [master, main]
    # No tag trigger (TIZ-31): a v*.*.* push only ran the build job (the
    # release-latest job is skipped on tags) and published nothing a consumer
    # reads; versions ship via the rolling "latest" release from master.
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build widget package
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.x'
          cache: 'npm'
          # package-lock.json is committed (audit W105 T-01) — the dependency
          # resolution is pinned to exact git-dep commit SHAs, so `npm ci` gives a
          # reproducible install and the setup-node cache works off the lock file.

      - name: Install dependencies
        run: npm ci --allow-git=all

      - name: Build + assemble package/
        run: npm run package

      - name: Assert committed package/ is fresh
        # shipped == audited (audit W105 T-02). `npm run package` rebuilt package/
        # from the current source; if the committed copy matches, the working tree
        # is clean under package/. Any modification / deletion / untracked file here
        # means the widget that ships to TVs drifted from src — rebuild and commit.
        run: |
          status="$(git status --porcelain -- package/)"
          if [ -n "$status" ]; then
            echo "::error::package/ is stale vs a fresh build (audit W105 T-02). Run \`npm run package\` and commit the result."
            echo "$status"
            exit 1
          fi
          echo "package/ is fresh (matches a clean build of this commit)."


      - name: Zip the widget (UNSIGNED .wgt)
        # A .wgt is a zip of the widget root (config.xml + index.html + assets).
        # This is UNSIGNED — Tizen Studio / the `tizen` CLI must re-sign it with
        # author + distributor certs before a retail TV will install it. It is
        # published as the build artifact for inspection / dev-signing.
        run: |
          cd package
          zip -r -X ../phlix-tizen-unsigned.wgt .

      - name: Upload widget artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: phlix-tizen-wgt
          path: phlix-tizen-unsigned.wgt
          if-no-files-found: error

  release-latest:
    name: Update "latest" prerelease
    needs: build
    # On every master push, overwrite a rolling "latest" GitHub Release carrying
    # the RAW (unsigned) .wgt as a directly-downloadable asset (GitHub Actions
    # artifacts are always served zipped — a Release is the only way to offer the
    # bare widget). Skipped on PRs.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download widget artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: phlix-tizen-wgt
          path: artifacts

      - name: Stamp release facts (review m26)
        # A rolling "latest" artifact is otherwise unverifiable: the body now
        # carries the widget version (package.json SSOT) and the sha256 of the
        # EXACT bytes being attached, so a downloaded .wgt can be checked
        # against the release note without re-deriving anything.
        id: facts
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum artifacts/phlix-tizen-unsigned.wgt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Move "latest" tag to this commit (atomic — no delete window)
        # TIZ-30: the old delete-then-recreate left a window with NO latest
        # release (and a failed publish left none at all). Now the tag is moved
        # in place via the API and the existing release is updated by the
        # publish step, so a consumer always sees a release.
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="${GITHUB_SHA}" -F force=true
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/latest" -f sha="${GITHUB_SHA}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish "latest" prerelease
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: latest
          name: Latest (master)
          body: |
            Rolling build v${{ steps.facts.outputs.version }} of the latest `master` commit (${{ github.sha }}).

            - **SHA-256** (of the attached file, review m26):
              `${{ steps.facts.outputs.sha256 }}`
            - **`phlix-tizen-unsigned.wgt`** — the Tizen widget package (widget version `${{ steps.facts.outputs.version }}`). It is
              **unsigned**: sign it with your author + distributor certificates
              via Tizen Studio or the `tizen` CLI before installing on a TV.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: artifacts/phlix-tizen-unsigned.wgt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
