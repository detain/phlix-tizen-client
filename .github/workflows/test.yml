name: Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --allow-git=all

      - name: Run unit tests (with coverage floor gate — S501 T-13)
        run: npx vitest run --coverage

      # M-TIZEN-12 (review tizen__devops MIN-2): tests/ and scripts/ typecheck.
      # The prod `vue-tsc --noEmit` gate covers src/ only, so type drift in test
      # fixtures and dev scripts (vitest mock generics, JSDoc on the .mjs/.js
      # tooling) previously surfaced only at runtime. `npm run typecheck:tests`
      # checks everything else with the same strict settings; the only files
      # outside it are the shrink-only ledger in tsconfig.tests.json's
      # "exclude" (vitest v5 mock-typing migration owed) — enforced by
      # tests/unit/testsTypecheckLedger.test.ts.
      - name: Type-check tests and scripts
        run: npm run typecheck:tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

      # M-TIZEN-13 (review tizen__devops MIN-3): npm-audit gate. Placed LAST so
      # a supply-chain red never masks (or is masked by) test results. Raw exit
      # code, no `|| true`: passes only while every reported advisory id is
      # explicitly justified in scripts/audit-gate.mjs's ALLOWED_ADVISORIES,
      # and a broken/injectable audit output exits STRUCTURE-ERROR (2), never
      # silently 0. The bare `npm audit --audit-level=high` it replaces hides
      # every sub-high advisory; this gate sees all severities.
      - name: Security audit
        run: node scripts/audit-gate.mjs
