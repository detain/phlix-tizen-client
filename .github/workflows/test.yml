name: Test

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --allow-git=all

      - name: Run unit tests (with coverage floor gate — S501 T-13)
        run: npx vitest run --coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

      # M-TIZEN-13 (review tizen__devops MIN-3): npm-audit gate. Placed LAST so
      # a supply-chain red never masks (or is masked by) test results. Raw exit
      # code, no `|| true`: passes only while every reported advisory id is
      # explicitly justified in scripts/audit-gate.mjs's ALLOWED_ADVISORIES,
      # and a broken/injectable audit output exits STRUCTURE-ERROR (2), never
      # silently 0. The bare `npm audit --audit-level=high` it replaces hides
      # every sub-high advisory; this gate sees all severities.
      - name: Security audit
        run: node scripts/audit-gate.mjs
