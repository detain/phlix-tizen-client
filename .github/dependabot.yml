# In-repo Dependabot scope (M-TIZEN-13 / review tizen__devops MIN-3): before this
# file existed, dependency PRs (e.g. #119, commit 7c88559, "the npm_and_yarn
# group") arrived from ORGANIZATION-level config that no repo reader could see
# or review as an artifact. The manifest below declares the same effective
# scope in-repo: the root npm ecosystem, grouped so multi-package bumps arrive
# as one PR like the observed history. scripts/audit-gate.mjs is the
# backstop for what Dependabot's window lets age.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm_and_yarn:
        patterns:
          - "*"

  # RT-065 (review tizen__devops, 2026-11-04): the workflows float action MAJOR
  # tags (actions/checkout@v6, setup-node@v6, upload-artifact@v7,
  # download-artifact@v8, softprops/action-gh-release@v3), so a new action major
  # can ship silently — the estate has taken breakage exactly this way before.
  # Declaring the github-actions ecosystem alongside npm gives a weekly PR signal
  # when a pinned major advances.
  # RT-065 (review tizen__devops Info #1): the workflows float action MAJOR tags
  # (actions/checkout@v6, setup-node@v6, upload/download-artifact@v7/@v8,
  # softprops/action-gh-release@v3), so a new action major can ship with no PR
  # signal — an estate-observed breakage class. This ecosystem adds the weekly
  # Dependabot bump signal alongside the npm entry above.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
